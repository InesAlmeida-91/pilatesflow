{% extends "base.html" %}
{% block title %}Recuperar Password{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>🔑 Recuperar Password</h1>
    <p style="color: #7f8c8d; margin-bottom: 20px; text-align: center;">Introduza o seu e-mail para receber instruções de recuperação.</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="seu@email.com">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Enviar</button>
    </form>
    <div class="auth-link">
        <p><a href="{{ url_for('login_page') }}">← Voltar ao login</a></p>
    </div>
</div>
{% endblock %}
