{% extends "base.html" %}
{% block title %}Perfil{% endblock %}

{% block content %}
<h1>👤 Meu Perfil</h1>
<div class="card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="name">Nome</label>
            <input type="text" id="name" name="name" value="{{ user.name }}" required>
        </div>
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" value="{{ user.email }}" required>
        </div>
        <hr style="margin: 25px 0; border: 1px solid #eee;">
        <p style="color: #7f8c8d; margin-bottom: 15px;">Deixe os campos de password em branco se não quiser alterar.</p>
        <div class="form-group">
            <label for="current_password">Password atual</label>
            <div style="position:relative; display:flex; align-items:center;">
                <input type="password" id="current_password" name="current_password" placeholder="Password atual" style="flex:1; padding-right:2.5rem;">
                <button type="button" onclick="togglePassword('current_password', this)" style="position:absolute; right:0.6rem; background:none; border:none; cursor:pointer; font-size:1.1rem;" title="Mostrar/Esconder password">👁️</button>
            </div>
        </div>
        <div class="form-group">
            <label for="new_password">Nova password</label>
            <div style="position:relative; display:flex; align-items:center;">
                <input type="password" id="new_password" name="new_password" placeholder="Nova password" style="flex:1; padding-right:2.5rem;">
                <button type="button" onclick="togglePassword('new_password', this)" style="position:absolute; right:0.6rem; background:none; border:none; cursor:pointer; font-size:1.1rem;" title="Mostrar/Esconder password">👁️</button>
            </div>
            <small style="color: #666; font-size: 0.85em;">Mín. 7 chars, 1 maiúsc., 1 minúsc., 1 num., 1 especial</small>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Guardar Alterações</button>
    </form>
</div>
{% endblock %}
{% block scripts %}
<script>
function togglePassword(id, btn) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁️';
    }
}
</script>
{% endblock %}
