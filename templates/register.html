{% extends "base.html" %}
{% block title %}Registo - Estúdio Pilates{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>📝 Registo de Aluno</h1>
    <form method="POST">
        <div class="form-group">
            <label for="name">Nome completo</label>
            <input type="text" id="name" name="name" required placeholder="O seu nome" value="{{ name }}">
        </div>
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="seu@email.com" value="{{ email }}">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <div style="position:relative; display:flex; align-items:center;">
                <input type="password" id="password" name="password" required placeholder="Introduza a password" style="flex:1; padding-right:2.5rem;">
                <button type="button" onclick="togglePassword('password', this)" style="position:absolute; right:0.6rem; background:none; border:none; cursor:pointer; font-size:1.1rem;" title="Mostrar/Esconder password">👁️</button>
            </div>
            <small style="color: #666; font-size: 0.85em;">Mín. 7 chars, 1 maiúsc., 1 minúsc., 1 num., 1 especial</small>
        </div>
        <button type="submit" class="btn btn-success" style="width:100%;">Registar</button>
    </form>
    <div class="auth-link">
        <p>Já tem conta? <a href="{{ url_for('login_page') }}">Fazer login</a></p>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function togglePassword(id, btn) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁️';
    }
}
</script>
{% endblock %}
