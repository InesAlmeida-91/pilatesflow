{% extends "base.html" %}
{% block title %}Registo - Estúdio Pilates{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>📝 Registo de Aluno</h1>
    <form method="POST">
        <div class="form-group">
            <label for="name">Nome completo</label>
            <input type="text" id="name" name="name" required placeholder="O seu nome">
        </div>
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Mín. 7 chars, 1 maiúsc., 1 minúsc., 1 num., 1 especial">
        </div>
        <button type="submit" class="btn btn-success" style="width:100%;">Registar</button>
    </form>
    <div class="auth-link">
        <p>Já tem conta? <a href="{{ url_for('login_page') }}">Fazer login</a></p>
    </div>
</div>
{% endblock %}
