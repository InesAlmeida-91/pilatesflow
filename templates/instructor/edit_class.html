{% extends "base.html" %}
{% block title %}Editar Aula{% endblock %}

{% block content %}
<h1>Editar Aula: {{ class_data.name }}</h1>
<div class="card">
    <form method="POST">
        <div class="form-group">
            <label for="name">Nome da Aula</label>
            <input type="text" id="name" name="name" value="{{ class_data.name }}">
        </div>
        <div class="info-row">
            <div class="form-group">
                <label for="schedule_date">Data (DD/MM/AAAA)</label>
                <input type="text" id="schedule_date" name="schedule_date" value="{{ class_data.schedule_date }}">
            </div>
            <div class="form-group">
                <label for="schedule_time">Hora (HH:MM)</label>
                <input type="text" id="schedule_time" name="schedule_time" value="{{ class_data.schedule_time }}">
            </div>
        </div>
        <div class="info-row">
            <div class="form-group">
                <label for="duration">Duração (minutos)</label>
                <input type="number" id="duration" name="duration" value="{{ class_data.duration }}" min="15" max="180">
            </div>
            <div class="form-group">
                <label for="max_students">Máximo de Alunos</label>
                <input type="number" id="max_students" name="max_students" value="{{ class_data.max_students }}" min="1" max="50">
            </div>
        </div>
        <div class="form-group">
            <label for="description">Descrição</label>
            <textarea id="description" name="description" rows="3">{{ class_data.description }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Guardar Alterações</button>
        <a href="{{ url_for('instructor_list_classes') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
