{% extends "base.html" %}
{% block title %}Login - Estúdio Pilates{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>🧘 Login</h1>
    <form method="POST">
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="seu@email.com" value="{{ email }}">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <div style="position:relative; display:flex; align-items:center;">
                <input type="password" id="password" name="password" required placeholder="Introduza a password" style="flex:1; padding-right:2.5rem;">
                <button type="button" onclick="togglePassword('password', this)" style="position:absolute; right:0.6rem; background:none; border:none; cursor:pointer; font-size:1.1rem;" title="Mostrar/Esconder password">👁️</button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Entrar</button>
    </form>
    <div class="auth-link">
        <p>Não tem conta? <a href="{{ url_for('register_page') }}">Registar como aluno</a></p>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function togglePassword(id, btn) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁️';
    }
}
</script>
{% endblock %}
